name: Importar banners del carrusel
on:
  push:
    branches:
      - fix/carousel-local-banner-assets
    paths:
      - .github/workflows/import-carousel-banners.yml
permissions:
  contents: write
jobs:
  import-banners:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar banners originales
        uses: actions/checkout@v4
      - name: Guardar imágenes en public/banners
        run: |
          mkdir -p public/banners
          curl -fL --retry 3 "https://elestratega.cl/wp-content/uploads/2026/11/LinaresYa-Descubre-Linares-wordpress.webp" -o public/banners/linaresya-banner.webp
          curl -fL --retry 3 "https://elestratega.cl/wp-content/uploads/2026/11/Sabores-Artesanales-de-Linares2-wordpress.webp" -o public/banners/jatis-mutis-banner.webp
          file public/banners/*.webp
          test -s public/banners/linaresya-banner.webp
          test -s public/banners/jatis-mutis-banner.webp
      - name: Guardar imágenes en Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/banners/*.webp
          git commit -m "Agregar banners locales para el carrusel"
          git push
